<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard — School Management System</title>
  <!-- <!-- <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
    rel="stylesheet" /> -->
  <link rel="stylesheet" href="../../css/style.css" />
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__brand">School<span>MS</span></div>

      <p class="sidebar__section-label">Overview</p>
      <ul class="sidebar__nav">
        <li>
          <a href="dashboard.html" class="sidebar__link is-active">My Dashboard</a>
        </li>
      </ul>
      <p class="sidebar__section-label">Academics</p>
      <ul class="sidebar__nav">
        <li>
          <a href="./resultpage.html" class="sidebar__link">End of Term Result</a>
        </li>
      </ul>
      <p class="sidebar__section-label">Communication</p>
      <ul class="sidebar__nav">
        <li>
          <a href="../admin-pages/announcements.html" class="sidebar__link">Announcements</a>
        </li>
      </ul>
    </aside>

    <header class="topbar">
      <h2 class="topbar__title">My Dashboard</h2>
      <div class="topbar__user">
        <span class="role-pill" id="userRole">Student</span>
        <span id="userName">—</span>
        <button class="btn btn-secondary btn-sm" id="logoutBtn">
          Log out
        </button>
      </div>
    </header>

    <main class="main">
      <div id="dashboardAlert"></div>
      <!-- Student identity card -->
      <section class="card">
        <div class="card__header">
          <h3>My details</h3>
        </div>
        <div class="form-grid">
          <div>
            <strong>Name:</strong> <span id="studentFullName">—</span>
          </div>
          <div>
            <strong>Admission No.:</strong>
            <span id="studentAdmissionNo">—</span>
          </div>
          <div><strong>Class:</strong> <span id="studentClass">—</span></div>
          <div>
            <strong>Gender:</strong> <span id="studentGender">—</span>
          </div>
        </div>
      </section>

      <!-- Today's attendance -->
      <section class="stat-grid">
        <div class="stat-card">
          <div class="stat-card__value" id="statTodayStatus">—</div>
          <div class="stat-card__label">Today's attendance</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__value" id="statTermPercent">—</div>
          <div class="stat-card__label">Attendance overall</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__value" id="statClassmateCount">—</div>
          <div class="stat-card__label">Classmates</div>
        </div>
      </section>

      <!-- Today's timetable -->
      <section class="card">
        <div class="card__header">
          <h3 style="margin: 0">Today's timetable</h3>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Subject</th>
                <th>Teacher</th>
              </tr>
            </thead>
            <tbody id="todayTimetableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="../../js/database/db.js"></script>
  <script type="module" src="../../js/auth.js"></script>
  <script type="module" src="../../js/utils.js"></script>
  <script type="module" src="../../js/student-dashboard.js"></script>
</body>

</html>
